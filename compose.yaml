services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: library_practice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d library_practice"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - library_data:/var/lib/postgresql/data

volumes:
  library_data:
